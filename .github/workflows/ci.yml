# SIFT CI
#
# Two jobs:
#  1. test — the full pytest suite (tests/), which includes the simulated-
#     user harness smoke tests (tests/sim/, small-N soak N=20 via the CLI
#     job below and the pytest sim tests).
#  2. sim-smoke — runs the sim harness CLI itself with a small N (20 users)
#     as the CI smoke test: SIFT_ENV=test python3 -m sift.sim.run --sim all
#     --n-users 20. SIMULATED output — infrastructure validation only, never
#     user-behavior evidence.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Full test suite (incl. tests/sim)
        env:
          SIFT_ENV: test
        run: python -m pytest tests/ -q
      - name: Waitlist endpoint tests (web/api)
        run: python -m unittest discover -s web/api -p "test_*.py" -v

  sim-smoke:
    # SIMULATED — infrastructure validation, not user-behavior evidence.
    # Small-N (20 users) smoke soak + anti-abuse attack sims + card-layer
    # lifecycle sim, all against an ephemeral test DB (SIFT_ENV=test).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Sim harness smoke (N=20, SIMULATED — infra validation only)
        env:
          SIFT_ENV: test
        run: python -m sift.sim.run --sim all --n-users 20 --runs-per-user 2 --workers 8 --out sim-report.json
      - name: Upload bannered sim report
        uses: actions/upload-artifact@v4
        with:
          name: sim-report
          path: sim-report.json
